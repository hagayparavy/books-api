# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: check-yaml
    - id: check-added-large-files
    - id: check-merge-conflict
    - id: check-toml
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.17.0
  hooks:
    # Run the linter.
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
# Disabled: the `gitleaks` id builds gitleaks from source with Go and hung. See docs/adr/0001-python-toolchain.md.
# - repo: https://github.com/gitleaks/gitleaks
#   rev: v8.30.0
#   hooks:
#     - id: gitleaks
# Local hook, not the pre-commit/mirrors-mypy mirror: the mirror runs mypy in an isolated env without
# the project's deps, so strict mode reports false import errors. This runs the project's own mypy.
- repo: local  # defined here, not cloned, so there is no `rev`
  hooks:
    - id: mypy
      name: mypy
      entry: uv run mypy  # same version as uv.lock / CI
      language: system  # run `entry` as-is, no isolated environment
      pass_filenames: false  # mypy checks the `files` list from pyproject.toml, not just staged files
      # Fixed: also run when only pyproject.toml changes — a [tool.mypy] edit can break type-checking.
      # was: types: [python]
      types_or: [python, toml]
