[project]
name = "books-api"
version = "0.1.0"
description = "REST API for the Books Tracker: books, reading status, and metadata lookup."
readme = "README.md"
# SPDX expression (PEP 639); the old `license = { text = ... }` table form is deprecated
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "hagay paravy", email = "104374729+hagayparavy@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

# Fixed: removed the `uv init` console script — the app will run under uvicorn, not as a CLI.
# was:
# [project.scripts]
# books-api = "books_api:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff.lint]
# Defaults (E4, E7, E9, F) plus: bugbear, pyupgrade, isort, simplify, pep8-naming, bandit (security)
extend-select = ["B", "UP", "I", "SIM", "N", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest is built on plain `assert`; bandit's S101 only makes sense for production code
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
